<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AGENCE SHAMAN CHOOZ PRODUCTION — Fiches &amp; Placements</title>
<meta name="theme-color" content="#23324A">
<meta name="description" content="Application de recrutement et de suivi des placements — AGENCE SHAMAN CHOOZ PRODUCTION">
<link rel="manifest" href="manifest.json">

<link rel="icon" href="icon-192.png">

<style>
:root{
  --ink:#20304A;
  --ink-2:#3A4C6B;
  --paper:#F1ECDF;
  --paper-2:#E7DFCB;
  --card:#FBF8F1;
  --stamp:#8A2E2A;
  --stamp-2:#B0453E;
  --gold:#A97F2E;
  --green:#3E6B4F;
  --line:#C9BFA4;
  --dotted: repeating-linear-gradient(90deg, var(--ink-2) 0 3px, transparent 3px 8px);
  --shadow: 0 1px 0 rgba(32,48,74,.08), 0 8px 24px -12px rgba(32,48,74,.35);
  --radius: 4px;
}
*{box-sizing:border-box;}
html[data-theme="dark"]{
  --ink:#EDE7D6; --ink-2:#B9AF95; --paper:#161B22; --paper-2:#20262F;
  --card:#1C222B; --line:#333B47; --stamp:#C7524A; --stamp-2:#D9685F;
  --gold:#D3A94E; --green:#5FA37A;
}
html[data-theme="dark"] body{background: radial-gradient(1200px 600px at 100% -10%, #ffffff08, transparent), var(--paper);}
html[data-theme="dark"] .thumb{background:var(--paper-2);}
.theme-toggle{
  background:none;border:1px solid #ffffff30;color:var(--paper);
  border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.lang-toggle{
  background:none;border:1px solid #ffffff30;color:var(--paper);
  border-radius:20px;padding:6px 10px;font-size:11.5px;cursor:pointer;flex:none;
}
.checklist{display:flex; flex-direction:column; gap:10px;}
.checklist label{display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;}
.checklist input[type=checkbox]{width:18px;height:18px;accent-color:var(--stamp);}
.progressbar{height:8px; background:var(--paper-2); border-radius:6px; overflow:hidden; margin:10px 0;}
.progressbar .fill{height:100%; background:var(--green); transition:width .3s;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, #ffffff20, transparent),
    var(--paper);
  color:var(--ink);
  font-family:'Public Sans', -apple-system, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces', serif;}
.mono{font-family:'IBM Plex Mono', monospace;}
button{font-family:inherit;}
a{color:inherit;}

/* ---- App shell ---- */
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px;
  display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:40;
  box-shadow:var(--shadow);
}
header.topbar .avatar-btn{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--gold);
  padding:0; overflow:hidden; flex:none; cursor:pointer;
  background:var(--paper-2);
  -webkit-tap-highlight-color:transparent;
}
header.topbar .avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
header.topbar .avatar-btn.hide{visibility:hidden;}

.avatar-overlay{
  position:fixed; inset:0; background:rgba(18,24,36,.94);
  display:flex; align-items:center; justify-content:center;
  z-index:100; opacity:0; pointer-events:none;
  transition:opacity .3s ease;
  padding:24px; cursor:zoom-out;
}
.avatar-overlay.show{opacity:1; pointer-events:auto;}
.avatar-overlay img{
  width:min(78vw,360px); height:min(78vw,360px);
  border-radius:50%; object-fit:cover;
  border:3px solid var(--gold);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  transform:scale(.85);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.2);
}
.avatar-overlay.show img{transform:scale(1);}
header.topbar .titles{flex:1; min-width:0;}
header.topbar .titles .t1{font-family:'Fraunces',serif; font-weight:700; font-size:16.5px; line-height:1.15;}
header.topbar .titles .t2{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#C9D3E0; margin-top:1px;}
header.topbar .back{
  background:none;border:1px solid #ffffff30;color:var(--paper);
  padding:7px 11px;border-radius:20px;font-size:12.5px;cursor:pointer;
}
header.topbar .who{font-size:11px;color:#C9D3E0;text-align:right;line-height:1.3;}

main{flex:1; padding:18px 16px 100px;}

/* ---- Home ---- */
.hero{
  text-align:center; padding:34px 10px 22px;
}
.hero .stampmark{
  display:inline-flex;align-items:center;justify-content:center;
  width:84px;height:84px;border-radius:50%;
  border:3px solid var(--gold);
  color:var(--stamp); font-family:'Fraunces',serif; font-weight:700; font-size:26px;
  overflow:hidden;
  margin-bottom:14px;
  cursor:pointer;
}
.hero h1{font-size:26px; margin:0 0 6px; color:var(--ink);}
.hero p{font-size:14px;color:var(--ink-2); max-width:36ch; margin:0 auto;}

.choice-grid{display:grid; gap:14px; margin-top:26px;}
.choice-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  display:flex; align-items:center; gap:14px;
  cursor:pointer; text-align:left;
  box-shadow:var(--shadow);
  transition:transform .15s ease;
}
.choice-card:active{transform:scale(.98);}
.choice-card .icon{
  width:46px;height:46px;border-radius:50%;
  background:var(--paper-2); display:flex;align-items:center;justify-content:center;
  font-size:20px; flex:none;
}
.choice-card .txt h3{margin:0 0 3px;font-size:16px;}
.choice-card .txt p{margin:0;font-size:12.5px;color:var(--ink-2);}

/* ---- Cards / Forms ---- */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:16px;
}
.panel .head{
  background:var(--paper-2);
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.panel .head h2{font-size:14.5px;margin:0;letter-spacing:.02em;}
.panel .head .num{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--stamp);
  border:1px solid var(--stamp); border-radius:20px; padding:2px 9px;
}
.panel .body{padding:16px;}

.field{margin-bottom:16px;}
.field label{
  display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-2); margin-bottom:6px; font-weight:600;
}
.field input, .field select, .field textarea{
  width:100%; border:none; border-bottom:2px dotted var(--line);
  background:transparent; padding:6px 2px 8px;
  font-size:15px; color:var(--ink); font-family:inherit;
  outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-bottom-color:var(--stamp); border-bottom-style:solid;
}
.field textarea{resize:vertical; min-height:56px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}

fieldset.relgroup{
  border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 12px 2px; margin:0 0 14px;
}
fieldset.relgroup legend{
  font-family:'Fraunces',serif; font-size:13px; padding:0 8px; color:var(--stamp);
}

.section-title{
  font-family:'Fraunces',serif; font-size:15px; margin:22px 0 10px; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

.photo-box{
  display:flex; align-items:center; gap:14px; margin-bottom:18px;
}
.photo-box .thumb{
  width:78px;height:96px; border:2px solid var(--ink); background:var(--paper-2);
  display:flex;align-items:center;justify-content:center; overflow:hidden; flex:none;
  font-size:10px; color:var(--ink-2); text-align:center; border-radius:2px;
}
.photo-box .thumb img{width:100%;height:100%;object-fit:cover;}
.photo-box .actions{display:flex; flex-direction:column; gap:8px;}
.btn-sm{
  border:1px solid var(--ink); background:var(--card); color:var(--ink);
  padding:7px 12px; border-radius:20px; font-size:12.5px; cursor:pointer;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--ink); color:var(--paper);
  border:none; border-radius:24px; padding:13px 20px;
  font-size:14.5px; font-weight:600; cursor:pointer; width:100%;
}
.btn.stamp{background:var(--stamp);}
.btn.ghost{background:transparent;border:1.5px solid var(--ink); color:var(--ink);}
.btn.gold{background:var(--gold);}
.btn:active{transform:scale(.985);}
.btn[disabled]{opacity:.5;}

.hint{font-size:12px;color:var(--ink-2);margin-top:4px;}
.err{color:var(--stamp); font-size:12.5px; margin-top:8px;}
.ok-banner{
  background:#EAF1EC;border:1px solid var(--green);color:var(--green);
  padding:12px 14px;border-radius:var(--radius);font-size:13.5px;margin-bottom:14px;
}

/* ---- Lists / Admin ---- */
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
.statcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 10px; text-align:center;
}
.statcard .n{font-family:'Fraunces',serif; font-size:22px; color:var(--stamp);}
.statcard .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-top:2px;}

.searchbar{display:flex; gap:8px; margin-bottom:14px;}
.searchbar input{
  flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 14px;
  font-size:14px; background:var(--card); outline:none;
}
.searchbar input:focus{border-color:var(--stamp);}

.rowitem{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:center;
  cursor:pointer;
}
.rowitem .av{
  width:42px;height:42px;border-radius:50%;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;
  font-family:'Fraunces',serif;color:var(--ink-2);font-size:15px;
}
.rowitem .av img{width:100%;height:100%;object-fit:cover;}
.rowitem .info{flex:1;min-width:0;}
.rowitem .info .n1{font-weight:600;font-size:14.5px;}
.rowitem .info .n2{font-size:12px;color:var(--ink-2);margin-top:2px;}
.badge{
  font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:600;
  white-space:nowrap;
}
.badge.actif{background:#EAF1EC;color:var(--green);}
.badge.termine{background:#EEE7D6;color:var(--gold);}
.badge.dispo{background:#E8EEF5;color:var(--ink-2);}
.badge.attente{background:#FBE9E7;color:var(--stamp);}

.tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto;}
.tabs button{
  flex:none; background:var(--card); border:1px solid var(--line); color:var(--ink-2);
  padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer;
}
.tabs button.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:13.5px;}
.detail-grid .k{color:var(--ink-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
.detail-grid .v{margin-bottom:8px;}

.fab{
  position:fixed; bottom:22px; right:calc(50% - 360px + 22px);
  background:var(--stamp); color:#fff; border:none; border-radius:50%;
  width:56px;height:56px; font-size:26px; box-shadow:var(--shadow); cursor:pointer;
  display:flex;align-items:center;justify-content:center; z-index:30;
}
@media (max-width:760px){ .fab{right:22px;} }

.center-msg{text-align:center; color:var(--ink-2); font-size:13.5px; padding:40px 20px;}
.lockscreen{padding-top:60px; text-align:center;}
.lockscreen .padlock{font-size:38px; margin-bottom:10px;}
.codebox{
  width:220px; margin:18px auto 6px; text-align:center; letter-spacing:.3em;
  font-size:20px; padding:12px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--card);
}
.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:24px;
  font-size:13px; box-shadow:var(--shadow); z-index:60; opacity:0; transition:opacity .25s;
  max-width:88%; text-align:center;
}
.toast.show{opacity:1;}
footer.foot{
  text-align:center; font-size:10.5px; color:var(--ink-2); padding:16px; opacity:.65;
}
.offline-flag{
  background:var(--gold); color:#fff; text-align:center; font-size:11.5px;
  padding:5px; display:none;
}
.offline-flag.show{display:block;}
@media print{
  header.topbar, .tabs, .searchbar, .fab, .toast, .offline-flag, .btn{display:none !important;}
  #receiptArea{border:none !important; box-shadow:none !important;}
  body{background:#fff;}
}
</style>

<body>

<div class="offline-flag" id="offlineFlag">Hors connexion — les données seront synchronisées dès le retour du réseau</div>

<div id="app">
  <header class="topbar">
    <button class="avatar-btn" id="avatarBtn" aria-label="Voir la photo en plein écran">
      <img src="avatar.jpg" alt="Fondateur — Agence Shaman Chooz Production">
    </button>
    <div class="titles">
      <div class="t1" id="topTitle">Agence Shaman Chooz Production</div>
      <div class="t2" id="topSub">Fiches &amp; Placements</div>
    </div>
    <div class="who" id="topWho"></div>
    <button class="lang-toggle" id="langToggle">FR</button>
    <button class="theme-toggle" id="themeToggle">🌓</button>
    <button class="back" id="backBtn" style="display:none;">← Retour</button>
  </header>
  <main id="main"></main>
</div>

<div class="avatar-overlay" id="avatarOverlay">
  <img src="profile-full.jpg" alt="Photo agrandie" id="avatarOverlayImg">
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, doc, getDocs, getDoc,
  query, orderBy, onSnapshot, serverTimestamp, enableIndexedDbPersistence,
  arrayUnion, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================================================
   CONFIGURATION FIREBASE
   Remplace les valeurs ci-dessous par celles de TON projet
   Firebase (gratuit) — voir README-INSTALLATION.md fourni
   à côté de ce fichier pour la marche à suivre pas à pas.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDv-jwjrB32qFQEzFj1unKD0evkmLH4OFg",
  authDomain: "shaman-bara-center-agence.firebaseapp.com",
  projectId: "shaman-bara-center-agence",
  storageBucket: "shaman-bara-center-agence.firebasestorage.app",
  messagingSenderId: "286946414728",
  appId: "1:286946414728:web:65be4307ad1ffaadb40f3d"
};

const ADMIN_CODE = "Shaman123chooz";

let fb = null, db = null, auth = null, fbReady = false;
let authReadyPromise = Promise.resolve(null);
try{
  if(firebaseConfig.apiKey !== "REMPLACE_MOI"){
    fb = initializeApp(firebaseConfig);
    db = getFirestore(fb);
    enableIndexedDbPersistence(db).catch(()=>{});
    auth = getAuth(fb);
    // Connexion anonyme automatique : chaque téléphone (agent ou admin)
    // obtient une identité Firebase invisible pour l'utilisateur, mais
    // exigée par les règles de sécurité Firestore (request.auth != null).
    authReadyPromise = new Promise((resolve)=>{
      onAuthStateChanged(auth, (user)=>{
        if(user){ resolve(user); }
        else{ signInAnonymously(auth).catch(err=>{ console.warn("Connexion anonyme échouée:", err); resolve(null); }); }
      });
    });
    fbReady = true;
  }
}catch(e){ console.warn("Firebase non configuré:", e); }

/* ---------- Stockage local de secours (mode démo / hors-ligne) ---------- */
const LOCAL_KEY = "shaman_local_db_v1";
function localDB(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {candidats:[], placements:[], journal:[], actualites:[]}; }
  catch(e){ return {candidats:[], placements:[], journal:[], actualites:[]}; }
}
function saveLocalDB(d){ localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); }

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ---------- Couche de données unifiée (Firestore si dispo, sinon local) ---------- */
const DataLayer = {
  async addCandidat(data){
    data.creeLe = new Date().toISOString();
    let id;
    if(fbReady){
      await authReadyPromise;
      const ref = await addDoc(collection(db,"candidats"), {...data, creeLe: serverTimestamp()});
      id = ref.id;
    }else{
      const d = localDB(); id = uid();
      d.candidats.push({id, ...data});
      saveLocalDB(d);
    }
    this.logJournal({type:"candidat", refId:id, label:`Fiche créée : ${data.nom||""} ${data.prenoms||""}`.trim()});
    return id;
  },
  async addPlacement(data){
    data.creeLe = new Date().toISOString();
    let id;
    if(fbReady){
      await authReadyPromise;
      const ref = await addDoc(collection(db,"placements"), {...data, creeLe: serverTimestamp()});
      id = ref.id;
    }else{
      const d = localDB(); id = uid();
      d.placements.push({id, ...data});
      saveLocalDB(d);
    }
    this.logJournal({type:"placement", refId:id, label:`Placement créé : ${data.candidatNom||""} → ${data.employeur||""}`});
    return id;
  },
  async updatePlacement(id, patch){
    if(fbReady){ await authReadyPromise; await updateDoc(doc(db,"placements",id), patch); }
    else{
      const d = localDB();
      const i = d.placements.findIndex(p=>p.id===id);
      if(i>-1) d.placements[i] = {...d.placements[i], ...patch};
      saveLocalDB(d);
    }
    this.logJournal({type:"placement", refId:id, label:`Placement mis à jour (${Object.keys(patch).join(", ")})`});
  },
  async updateCandidat(id, patch){
    if(fbReady){ await authReadyPromise; await updateDoc(doc(db,"candidats",id), patch); }
    else{
      const d = localDB();
      const i = d.candidats.findIndex(c=>c.id===id);
      if(i>-1) d.candidats[i] = {...d.candidats[i], ...patch};
      saveLocalDB(d);
    }
  },
  async addNote(candidatId, noteObj){
    if(fbReady){
      await authReadyPromise;
      await updateDoc(doc(db,"candidats",candidatId), { notes: arrayUnion(noteObj) });
    }else{
      const d = localDB();
      const i = d.candidats.findIndex(c=>c.id===candidatId);
      if(i>-1){ d.candidats[i].notes = (d.candidats[i].notes||[]).concat([noteObj]); }
      saveLocalDB(d);
    }
    this.logJournal({type:"note", refId:candidatId, label:`Note ajoutée : "${(noteObj.texte||"").slice(0,60)}"`});
  },
  async logJournal(entry){
    entry.ts = new Date().toISOString();
    entry.agent = getAgentName() || (session.role==="admin" ? "Administrateur" : "Agent");
    if(fbReady){
      try{
        await authReadyPromise;
        await addDoc(collection(db,"journal"), {...entry, ts: serverTimestamp()});
      }catch(e){ console.warn("Journal non enregistré:", e); }
    }else{
      const d = localDB();
      d.journal = d.journal || [];
      d.journal.push({id:uid(), ...entry});
      saveLocalDB(d);
    }
  },
  listenJournal(cb){
    if(fbReady){
      let unsub = ()=>{};
      let stopped = false;
      authReadyPromise.then(()=>{
        if(stopped) return;
        const q = query(collection(db,"journal"), orderBy("ts","desc"), limit(200));
        unsub = onSnapshot(q, snap => cb(snap.docs.map(dd=>({id:dd.id, ...dd.data()}))), ()=>cb([]));
      });
      return ()=>{ stopped = true; unsub(); };
    }else{
      cb((localDB().journal||[]).slice().reverse());
      return ()=>{};
    }
  },
  async addActualite(data){
    data.ts = new Date().toISOString();
    if(fbReady){
      await authReadyPromise;
      await addDoc(collection(db,"actualites"), {...data, ts: serverTimestamp()});
    }else{
      const d = localDB();
      d.actualites = d.actualites || [];
      d.actualites.unshift({id:uid(), ...data});
      saveLocalDB(d);
    }
    this.logJournal({type:"actualite", refId:"", label:`Actualité publiée : "${(data.titre||"").slice(0,60)}"`});
  },
  listenActualites(cb){
    if(fbReady){
      let unsub = ()=>{};
      let stopped = false;
      authReadyPromise.then(()=>{
        if(stopped) return;
        const q = query(collection(db,"actualites"), orderBy("ts","desc"), limit(30));
        unsub = onSnapshot(q, snap => cb(snap.docs.map(dd=>({id:dd.id, ...dd.data()}))), ()=>cb([]));
      });
      return ()=>{ stopped = true; unsub(); };
    }else{
      cb(localDB().actualites || []);
      return ()=>{};
    }
  },
  listenCandidats(cb){
    if(fbReady){
      let unsub = ()=>{};
      let stopped = false;
      authReadyPromise.then(()=>{
        if(stopped) return;
        const q = query(collection(db,"candidats"), orderBy("creeLe","desc"));
        unsub = onSnapshot(q, snap => cb(snap.docs.map(dd=>({id:dd.id, ...dd.data()}))));
      });
      return ()=>{ stopped = true; unsub(); };
    }else{
      cb(localDB().candidats.slice().reverse());
      return ()=>{};
    }
  },
  listenPlacements(cb){
    if(fbReady){
      let unsub = ()=>{};
      let stopped = false;
      authReadyPromise.then(()=>{
        if(stopped) return;
        const q = query(collection(db,"placements"), orderBy("creeLe","desc"));
        unsub = onSnapshot(q, snap => cb(snap.docs.map(dd=>({id:dd.id, ...dd.data()}))));
      });
      return ()=>{ stopped = true; unsub(); };
    }else{
      cb(localDB().placements.slice().reverse());
      return ()=>{};
    }
  }
};

/* =========================================================
   MODE HORS LIGNE — durée maximale d'utilisation sans réseau
   L'application (formulaires, enregistrements) reste utilisable
   hors ligne ; les données sont mises en file d'attente puis
   synchronisées automatiquement au retour du réseau. Ce délai
   sert uniquement à prévenir l'agent/l'admin s'il reste trop
   longtemps sans se reconnecter.
   ========================================================= */
const OFFLINE_MAX_DAYS = 7; // modifiable : durée max recommandée hors connexion
const LAST_ONLINE_KEY = "shaman_last_online_ts";

function markOnlineNow(){
  localStorage.setItem(LAST_ONLINE_KEY, Date.now().toString());
}
function getOfflineDays(){
  const last = parseInt(localStorage.getItem(LAST_ONLINE_KEY) || Date.now().toString(), 10);
  return (Date.now() - last) / 86400000;
}
if(navigator.onLine) markOnlineNow();

function updateOfflineBanner(){
  const flag = $("#offlineFlag");
  if(navigator.onLine){
    markOnlineNow();
    flag.classList.remove("show");
    return;
  }
  const days = getOfflineDays();
  const remaining = Math.max(0, OFFLINE_MAX_DAYS - days);
  if(days >= OFFLINE_MAX_DAYS){
    flag.textContent = "⚠️ Hors connexion depuis plus de " + OFFLINE_MAX_DAYS + " jours — vous pouvez continuer à enregistrer, mais reconnectez-vous dès que possible pour synchroniser vos fiches.";
  }else{
    flag.textContent = "Hors connexion — vous pouvez continuer à travailler normalement. Synchronisation automatique au retour du réseau (encore " + Math.ceil(remaining) + " j avant reconnexion recommandée).";
  }
  flag.classList.add("show");
}
window.addEventListener("online", updateOfflineBanner);
window.addEventListener("offline", updateOfflineBanner);

/* ---------- Compression photo (canvas) ---------- */
function compressImage(file, maxW=480, quality=0.62){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

              </select>
            </div>

          <div class="head"><h2>Employeur &amp; tâche</h2></div>
          <div class="body">
            <div class="field"><label>Employeur</label><input name="employeur" required value="${v.employeur||""}"></div>
            <div class="field"><label>Contact employeur</label><input name="employeurContact" value="${v.employeurContact||""}"></div>
            <div class="field"><label>Tâche</label><input name="tache" placeholder="Ex : Ménagère, Nounou, Cuisinière…" required value="${v.tache||""}"></div>
            <div class="row2">
              <div class="field"><label>Salaire</label><input name="salaire" value="${v.salaire||""}"></div>
              <div class="field"><label>Devise</label>
                <select name="devise">${DEVISES.map(d=>`<option ${(v.devise||"FCFA")===d?"selected":""}>${d}</option>`).join("")}</select>
              </div>
            </div>
            <div class="row2">
              <div class="field"><label>Pays du poste</label><input name="paysEmployeur" placeholder="Ex : Liban, France…" value="${v.paysEmployeur||""}"></div>
              <div class="field"><label>Date de début</label><input type="date" name="dateDebut" value="${v.dateDebut||""}"></div>
            </div>
            <div class="field"><label>Date de fin (si connue)</label><input type="date" name="dateFin" value="${v.dateFin||""}"></div>
            <div class="row2">
              <div class="field"><label>Commission agence (%)</label><input name="commissionPct" type="number" min="0" max="100" step="0.5" placeholder="Ex : 10" value="${v.commissionPct||""}"></div>
              <div class="field"><label>Évaluation candidat(e)</label>
                <select name="noteEtoiles">
                  <option value="">—</option>
                  <option value="5" ${v.noteEtoiles=="5"?"selected":""}>★★★★★ Excellent</option>
                  <option value="4" ${v.noteEtoiles=="4"?"selected":""}>★★★★ Très bien</option>
                  <option value="3" ${v.noteEtoiles=="3"?"selected":""}>★★★ Correct</option>
                  <option value="2" ${v.noteEtoiles=="2"?"selected":""}>★★ Insuffisant</option>
                  <option value="1" ${v.noteEtoiles=="1"?"selected":""}>★ Problématique</option>
                </select>
              </div>
            </div>
            <div class="field"><label>Appréciation</label><textarea name="appreciation">${v.appreciation||""}</textarea></div>
          </div>
        </div>
        <div class="panel">
          <div class="head"><h2>Checklist de conformité</h2></div>
          <div class="body checklist">
            <label><input type="checkbox" name="ckContrat" ${v.ckContrat?"checked":""}> Contrat signé</label>
            <label><input type="checkbox" name="ckAssurance" ${v.ckAssurance?"checked":""}> Assurance santé souscrite</label>
            <label><input type="checkbox" name="ckVisa" ${v.ckVisa?"checked":""}> Visa / autorisation de travail obtenu</label>
            <label><input type="checkbox" name="ckBillet" ${v.ckBillet?"checked":""}> Billet de voyage confirmé</label>
          </div>
        </div>
        <div id="placeErr" class="err"></div>
        ${session.role==="agent" ? `<p class="hint" style="text-align:center;margin-bottom:10px;">ℹ️ Ce placement sera transmis à l'administrateur pour validation avant d'être activé.</p>` : ""}
        <button class="btn stamp" type="submit" id="submitPlace">${editId ? "Renvoyer pour validation" : "Enregistrer le placement"}</button>
      </form>
    `;
    $("#placeForm").onsubmit = async (e)=>{
      e.preventDefault();
      const btn = $("#submitPlace"); btn.disabled = true; btn.textContent = "Enregistrement…";
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      const cand = candidats.find(c=>c.id===data.candidatId);
      data.candidatNom = cand ? `${cand.nom||""} ${cand.prenoms||""}`.trim() : "";
      data.agentNom = getAgentName() || (session.role==="admin"?"Administrateur":session.role==="supervisor"?`Superviseur (${session.region})`:"Agent");
      /* Outil 22 — validation administrateur obligatoire pour les placements créés par un agent */
      if(session.role === "agent"){
        data.statut = "En attente";
      }else{
        data.statut = data.dateFin ? "Terminé" : "Actif";
      }
      data.ckContrat = e.target.ckContrat.checked;
      data.ckAssurance = e.target.ckAssurance.checked;
      data.ckVisa = e.target.ckVisa.checked;
      data.ckBillet = e.target.ckBillet.checked;
      try{
        if(editId){
          data.rejectReason = null;
          data.valideParAdmin = false;
          await DataLayer.updatePlacement(editId, data);
          toast("Placement corrigé et renvoyé pour validation ✓");
          nav("mesPlacements");
        }else{
          await DataLayer.addPlacement(data);
          toast(data.statut==="En attente" ? "Placement envoyé pour validation ✓" : "Placement enregistré ✓");
          nav("agentHome");
        }
      }catch(err){
        $("#placeErr").textContent = "Erreur : " + err.message;
        btn.disabled = false; btn.textContent = editId ? "Renvoyer pour validation" : "Enregistrer le placement";
      }
    };
  }
};

routes.adminHome = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop(session.role==="supervisor" ? `Superviseur — ${session.region}` : "Espace Administrateur","Vue d'ensemble", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;

  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands= session.region ? list.filter(c=>c.pays===session.region) : list; draw(); });
  DataLayer.listenPlacements(list=>{ places= session.region ? list.filter(p=> cands.some(c=>c.id===p.candidatId)) : list; draw(); });

  function draw(){
    const actifs = places.filter(p=>p.statut==="Actif").length;
    const termines = places.filter(p=>p.statut==="Terminé").length;
    const now = new Date();
    const nonPlaces = cands.filter(c=>{
      if(c.statut!=="Disponible") return false;
      const has = places.some(p=>p.candidatId===c.id && p.statut==="Actif");
      if(has) return false;
      const d = toDateSafe(c.creeLe);
      return d && daysBetween(d, now) >= 30;
    }).length;
    const finProches = places.filter(p=>{
      if(p.statut!=="Actif" || !p.dateFin) return false;
      const d = toDateSafe(p.dateFin);
      if(!d) return false;
      const diff = daysBetween(now, d);
      return diff >= 0 && diff <= 7;
    }).length;
    const commissionTotal = places.reduce((sum,p)=>{
      if(!p.commissionPct) return sum;
      return sum + Math.round(parseAmount(p.salaire) * (parseFloat(p.commissionPct)||0) / 100);
    }, 0);
    const enAttente = places.filter(p=>p.statut==="En attente").length;

    mainEl.innerHTML = `
      <div class="statgrid">
        <div class="statcard"><div class="n">${cands.length}</div><div class="l">Candidats</div></div>
        <div class="statcard"><div class="n">${actifs}</div><div class="l">Placements actifs</div></div>
        <div class="statcard"><div class="n">${termines}</div><div class="l">Terminés</div></div>
      </div>
      ${enAttente>0 ? `
      <div class="panel">
        <div class="head"><h2>🕓 Placements à valider</h2><span class="num mono">${enAttente}</span></div>
        <div class="body">
          <p style="font-size:13.5px;margin:0 0 10px;">${enAttente} placement(s) enregistré(s) par vos assistants attendent votre validation avant d'être activés.</p>
          <button class="btn stamp" id="seeValidation">Examiner et valider</button>
        </div>
      </div>` : ""}
      ${(nonPlaces>0 || finProches>0) ? `
      <div class="panel">
        <div class="head"><h2>⏰ Alertes</h2><span class="num mono">${nonPlaces+finProches}</span></div>
        <div class="body">
          ${nonPlaces>0?`<p style="font-size:13.5px;margin:0 0 8px;">🟠 <strong>${nonPlaces}</strong> candidat(e)s disponibles depuis plus de 30 jours sans placement.</p>`:""}
          ${finProches>0?`<p style="font-size:13.5px;margin:0;">🔴 <strong>${finProches}</strong> placement(s) se terminent dans les 7 prochains jours.</p>`:""}
          <button class="btn ghost" id="seeAlerts" style="margin-top:10px;">Voir le détail</button>
        </div>
      </div>` : ""}
      <div class="choice-grid">
        <button class="choice-card" id="toCands">
          <div class="icon">📇</div>
          <div class="txt"><h3>Tous les candidats</h3><p>Rechercher, consulter et gérer les fiches</p></div>
        </button>
        <button class="choice-card" id="toPlace">
          <div class="icon">🤝</div>
          <div class="txt"><h3>Tous les placements</h3><p>Suivre l'état de chaque placement${commissionTotal>0?` · Commissions : ${commissionTotal.toLocaleString("fr-FR")}`:""}</p></div>
        </button>
        <button class="choice-card" id="toOutils">
          <div class="icon">🛠️</div>
          <div class="txt"><h3>${t("outilsCard")}</h3><p>${t("outilsDesc")}</p></div>
        </button>
        <button class="choice-card" id="toOutils2">
          <div class="icon">🌍</div>
          <div class="txt"><h3>${t("outils2Card")}</h3><p>${t("outils2Desc")}</p></div>
        </button>
        <button class="choice-card" id="toValidation">
          <div class="icon">🕓</div>
          <div class="txt"><h3>Validation des placements</h3><p>Examiner ce que vos assistants ont enregistré</p></div>
        </button>
        <button class="choice-card" id="toActualites">
          <div class="icon">📰</div>
          <div class="txt"><h3>Actualités de l'agence</h3><p>Publier une information pour tous les agents</p></div>
        </button>
        <button class="choice-card" id="toPerformance">
          <div class="icon">🏆</div>
          <div class="txt"><h3>Performance par agent</h3><p>Fiches et placements réalisés par chacun</p></div>
        </button>
        <button class="choice-card" id="toShareAdmin">
          <div class="icon">📲</div>
          <div class="txt"><h3>Partager l'application</h3><p>Lien et QR code à donner aux assistants</p></div>
        </button>
      </div>
    `;
    $("#toCands").onclick = ()=> nav("list",{tab:"candidats"});
    $("#toPlace").onclick = ()=> nav("list",{tab:"placements"});
    $("#toOutils").onclick = ()=> nav("outils");
    $("#toOutils2").onclick = ()=> nav("outils2");
    $("#toValidation").onclick = ()=> nav("validation");
    $("#toActualites").onclick = ()=> nav("actualites");
    $("#toPerformance").onclick = ()=> nav("performance");
    $("#toShareAdmin").onclick = ()=> nav("share");
    const seeAlerts = $("#seeAlerts");
    if(seeAlerts) seeAlerts.onclick = ()=> nav("alertes");
    const seeVal = $("#seeValidation");
    if(seeVal) seeVal.onclick = ()=> nav("validation");
  }
};

routes.performance = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Performance par agent","Vue d'ensemble par personne", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands= session.region ? list.filter(c=>c.pays===session.region) : list; draw(); });
  DataLayer.listenPlacements(list=>{ places= session.region ? list.filter(p=> cands.some(c=>c.id===p.candidatId)) : list; draw(); });

  function draw(){
    const agents = new Set([...cands.map(c=>c.agentNom), ...places.map(p=>p.agentNom)].filter(Boolean));
    const rows = [...agents].map(a=>{
      const nbFiches = cands.filter(c=>c.agentNom===a).length;
      const mine = places.filter(p=>p.agentNom===a);
      const valides = mine.filter(p=>p.statut==="Actif"||p.statut==="Terminé").length;
      const rejetes = mine.filter(p=>p.statut==="Rejeté").length;
      return {a, nbFiches, nbPlacements:mine.length, valides, rejetes};
    }).sort((x,y)=> (y.nbFiches+y.nbPlacements) - (x.nbFiches+x.nbPlacements));

    mainEl.innerHTML = rows.length ? `
      <div class="panel"><div class="body">
        ${rows.map(r=>`
          <div class="rowitem" style="cursor:default; align-items:flex-start;">
            <div class="av">👤</div>
            <div class="info">
              <div class="n1">${r.a}</div>
              <div class="n2">${r.nbFiches} fiche(s) candidat(e) · ${r.nbPlacements} placement(s) (${r.valides} validé(s)${r.rejetes?`, ${r.rejetes} rejeté(s)`:""})</div>
            </div>
          </div>
        `).join("")}
      </div></div>
    ` : `<div class="center-msg">Aucune donnée d'activité pour l'instant.</div>`;
  }
};

            <div><div class="k">Nom complet</div><div class="v">${p.candidatNom||"—"}</div></div>
            <div><div class="k">Contact</div><div class="v">${cand ? (cand.contact||"—") : "—"}</div></div>
            <div><div class="k">Domicile</div><div class="v">${cand ? (cand.domicile||"—") : "—"}</div></div>
            <div><div class="k">Domaine</div><div class="v">${cand ? (cand.domaineCompetence||"—") : "—"}</div></div>
          </div>

          <div class="section-title">Informations sur l'employeur</div>
          <div class="detail-grid">
            <div><div class="k">Employeur</div><div class="v">${p.employeur||"—"}</div></div>
            <div><div class="k">Contact employeur</div><div class="v">${p.employeurContact||"—"}</div></div>

            <div><div class="k">Tâche</div><div class="v">${p.tache||"—"}</div></div>

/* ---------------- OUTIL : TABLEAU DE BORD GRAPHIQUE ---------------- */
routes.dashboard = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Tableau de bord","Évolution de l'activité", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands=list; draw(); });
  DataLayer.listenPlacements(list=>{ places=list; draw(); });

  function monthBuckets(list, field){
    const buckets = {};
    const now = new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      buckets[d.getFullYear()+"-"+d.getMonth()] = 0;
    }
    list.forEach(item=>{
      const d = toDateSafe(item[field]);
      if(!d) return;
      const key = d.getFullYear()+"-"+d.getMonth();
      if(key in buckets) buckets[key] += 1;
    });
    return buckets;
  }
  const moisNoms = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
  function drawBars(buckets, color){
    const vals = Object.entries(buckets);
    const max = Math.max(1, ...vals.map(v=>v[1]));
    return `<div style="display:flex; align-items:flex-end; gap:8px; height:110px; padding:8px 0;">
      ${vals.map(([key,val])=>{
        const m = parseInt(key.split("-")[1],10);
        const h = Math.round((val/max)*90) + 6;
        return `<div style="flex:1; text-align:center;">
          <div style="height:${h}px; background:${color}; border-radius:3px 3px 0 0; margin:0 auto; width:60%;"></div>
          <div style="font-size:10px; color:var(--ink-2); margin-top:4px;">${moisNoms[m]}</div>
          <div style="font-size:11px; font-weight:600;">${val}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function draw(){
    mainEl.innerHTML = `
      <div class="panel">
        <div class="head"><h2>Nouvelles fiches candidats / mois</h2></div>
        <div class="body">${drawBars(monthBuckets(cands,"creeLe"), "var(--stamp)")}</div>
      </div>
      <div class="panel">
        <div class="head"><h2>Nouveaux placements / mois</h2></div>
        <div class="body">${drawBars(monthBuckets(places,"creeLe"), "var(--green)")}</div>
      </div>
    `;
  }
};

routes.alertes = () => {
  if(!isAdminish()){ nav("adminLogin"); return; }
  setTop("Alertes","Suivi proactif", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  let cands=[], places=[];
  DataLayer.listenCandidats(list=>{ cands=list; draw(); });
  DataLayer.listenPlacements(list=>{ places=list; draw(); });

  function draw(){
    const now = new Date();
    const nonPlaces = cands.filter(c=>{
      if(c.statut!=="Disponible") return false;
      const has = places.some(p=>p.candidatId===c.id && p.statut==="Actif");
      if(has) return false;
      const d = toDateSafe(c.creeLe);
      return d && daysBetween(d, now) >= 30;
    });
    const finProches = places.filter(p=>{
      if(p.statut!=="Actif" || !p.dateFin) return false;
      const d = toDateSafe(p.dateFin);
      if(!d) return false;
      const diff = daysBetween(now, d);
      return diff >= 0 && diff <= 7;
    });
    mainEl.innerHTML = `
      <div class="panel">
        <div class="head"><h2>🟠 Candidats disponibles depuis +30 jours</h2><span class="num mono">${nonPlaces.length}</span></div>
        <div class="body">
          ${nonPlaces.length ? nonPlaces.map(c=>`
            <div class="rowitem" data-id="${c.id}">
              <div class="av">${c.photo?`<img src="${c.photo}">`:(c.nom?c.nom[0]:"?")}</div>
              <div class="info"><div class="n1">${c.nom||""} ${c.prenoms||""}</div><div class="n2">Inscrit(e) le ${fmtDate(c.creeLe)}</div></div>
            </div>`).join("") : `<p class="hint">Aucun candidat en attente prolongée.</p>`}
        </div>
      </div>
      <div class="panel">
        <div class="head"><h2>🔴 Placements se terminant sous 7 jours</h2><span class="num mono">${finProches.length}</span></div>
        <div class="body">
          ${finProches.length ? finProches.map(p=>`
            <div class="rowitem" data-pid="${p.id}">
              <div class="av">🤝</div>
              <div class="info"><div class="n1">${p.candidatNom||""} → ${p.employeur||""}</div><div class="n2">Fin prévue le ${fmtDate(p.dateFin)}</div></div>
            </div>`).join("") : `<p class="hint">Aucune échéance imminente.</p>`}
        </div>
      </div>
    `;
    mainEl.querySelectorAll("[data-id]").forEach(el=> el.onclick = ()=> nav("candidatDetail",{id:el.dataset.id}));
    mainEl.querySelectorAll("[data-pid]").forEach(el=> el.onclick = ()=> nav("placementDetail",{id:el.dataset.pid}));
  }
};

      </div>
    `;

      const blob = new Blob([JSON.stringify({exporteLe:new Date().toISOString(), candidats:cands, placements:places}, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "shaman_bara_center_sauvegarde_"+new Date().toISOString().slice(0,10)+".json";
      a.click();
    };
    $("#exportCsv2").onclick = ()=> exportCSV(cands, places);
  }
};

function exportCSV(cands, places){
  function toCSV(rows){
    if(!rows.length) return "";
    const keys = Object.keys(rows[0]).filter(k=>k!=="photo");
    const lines = [keys.join(";")];
    rows.forEach(r=> lines.push(keys.map(k=> `"${(r[k]??"").toString().replace(/"/g,'""')}"`).join(";")));
    return lines.join("\n");
  }
  const blob = new Blob(["CANDIDATS\n"+toCSV(cands)+"\n\nPLACEMENTS\n"+toCSV(places)], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shaman_bara_center_export.csv";
  a.click();
}

          <div class="field" style="margin-top:12px;"><textarea id="newNoteInput" placeholder="Ajouter une note de suivi…"></textarea></div>
          <button class="btn ghost" id="addNoteBtn">+ Ajouter la note</button>
        </div>
      </div>
    `;
    $("#newPlaceFor").onclick = ()=> nav("placementForm",{candidatId:cand.id});
    $("#addNoteBtn").onclick = async ()=>{
      const txt = $("#newNoteInput").value.trim();
      if(!txt) return;
      await DataLayer.addNote(cand.id, {texte:txt, agent:getAgentName()||(session.role==="admin"?"Administrateur":"Agent"), ts:new Date().toISOString()});
      toast("Note ajoutée ✓");
    };
  }
};

/* ---------------- DÉTAIL PLACEMENT ---------------- */
routes.placementDetail = async (params) => {
  setTop("Fiche de suivi","Placement", true);
  mainEl.innerHTML = `<div class="center-msg">Chargement…</div>`;
  DataLayer.listenPlacements(list=>{
    const p = list.find(x=>x.id===params.id);
    if(!p){ mainEl.innerHTML = `<div class="center-msg">Introuvable.</div>`; return; }
    const etoiles = p.noteEtoiles ? "★".repeat(+p.noteEtoiles) + "☆".repeat(5-(+p.noteEtoiles)) : null;
    const commission = p.commissionPct ? Math.round(parseAmount(p.salaire)*(parseFloat(p.commissionPct)||0)/100) : null;
    const checks = [["ckContrat","Contrat signé"],["ckAssurance","Assurance santé"],["ckVisa","Visa/autorisation"],["ckBillet","Billet de voyage"]];
    const doneCount = checks.filter(([k])=>p[k]).length;
    const pct = Math.round(doneCount/checks.length*100);
    mainEl.innerHTML = `
      <div class="panel" id="receiptArea">
        <div class="head"><h2>${p.employeur}</h2><span class="badge ${placeBadgeClass(p.statut)}">${p.statut}</span></div>
        <div class="body">
          <div class="detail-grid">
            <div><div class="k">Candidat(e)</div><div class="v">${p.candidatNom||"—"}</div></div>
            <div><div class="k">Contact employeur</div><div class="v">${p.employeurContact||"—"}</div></div>
            <div><div class="k">Tâche</div><div class="v">${p.tache||"—"}</div></div>
            <div><div class="k">Salaire</div><div class="v">${fmtMoney(p.salaire,p.devise)}</div></div>
            <div><div class="k">Pays du poste</div><div class="v">${p.paysEmployeur||"—"}</div></div>
            <div><div class="k">Date de début</div><div class="v">${p.dateDebut||"—"}</div></div>
            <div><div class="k">Date de fin</div><div class="v">${p.dateFin||"En cours"}</div></div>
            ${etoiles?`<div><div class="k">Évaluation</div><div class="v">${etoiles}</div></div>`:""}
            ${commission!==null?`<div><div class="k">Commission agence</div><div class="v">${p.commissionPct}% = ${fmtMoney(commission,p.devise)}</div></div>`:""}
          </div>
          <div class="section-title">Conformité (${doneCount}/4)</div>
          <div class="progressbar"><div class="fill" style="width:${pct}%;"></div></div>
          <div class="checklist" style="font-size:13px;">
            ${checks.map(([k,label])=>`<div>${p[k]?"✅":"⬜️"} ${label}</div>`).join("")}
          </div>
          ${p.appreciation?`<div class="section-title">Appréciation</div><p style="font-size:13.5px;">${p.appreciation}</p>`:""}
          <div class="section-title">Agence</div>
          <p style="font-size:12.5px;color:var(--ink-2);">AGENCE SHAMAN CHOOZ PRODUCTION — Fiche de suivi de placement</p>
          ${p.statut==="Actif" && isAdminish() ? `<button class="btn gold" id="closeIt" style="margin-top:14px;">Marquer comme terminé</button>`:""}
          <button class="btn ghost" id="printReceipt" style="margin-top:10px;">🧾 Imprimer / enregistrer en PDF</button>
        </div>
      </div>
    `;
    const closeBtn = $("#closeIt");
    if(closeBtn) closeBtn.onclick = async ()=>{
      await DataLayer.updatePlacement(p.id, {statut:"Terminé", dateFin: new Date().toISOString().slice(0,10)});
      toast("Placement clôturé ✓");
    };
    $("#printReceipt").onclick = ()=> window.print();
  });
};

/* ---- Photo de profil : plein écran au clic, retour en un clic ---- */
const avatarBtn = $("#avatarBtn");
const avatarOverlay = $("#avatarOverlay");
function openAvatar(){ avatarOverlay.classList.add("show"); }
function closeAvatar(){ avatarOverlay.classList.remove("show"); }
avatarBtn.addEventListener("click", openAvatar);
avatarOverlay.addEventListener("click", closeAvatar);

/* ---- Boutons thème / langue (globaux, dans l'en-tête) ---- */
$("#themeToggle").addEventListener("click", ()=>{
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
});
$("#langToggle").textContent = getLang().toUpperCase();
$("#langToggle").addEventListener("click", ()=>{
  setLang(getLang()==="fr" ? "en" : "fr");
  $("#langToggle").textContent = getLang().toUpperCase();
  render();
});

/* ---- Service worker ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
